<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OduvanchikFit — Кабінет тренера</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { 300:'#F0CF72', 400:'#D4AF37', 500:'#E5A93C', 600:'#B8860B' },
            surf: { 950:'#05050A', 900:'#0A0A12', 800:'#10101C', 700:'#14141F', 600:'#222238', 500:'#2C2C44', 400:'#383858' }
          },
          fontFamily: { sans: ['Inter','system-ui','-apple-system','sans-serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --gold: #D4AF37;
      --gold-lt: #E5A93C;
      --emerald: #10B981;
      --rose: #F43F5E;
      --tr: 140ms cubic-bezier(.4,0,.2,1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100%; font-family: 'Inter', system-ui, sans-serif;
      background: #0D0D11; color: #F4F4F8; overflow: hidden;
    }
    body.dark { background: #0D0D11; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); }

    #app { min-height: 100vh; background: radial-gradient(circle at top, rgba(212,175,55,.07), transparent 38%), linear-gradient(180deg, #0D0D11 0%, #08080D 100%); }

    .sidebar-bg,
    .bottom-nav-bg,
    .modal-bg,
    .card,
    .stat-card,
    .calendar-event-card,
    .calendar-day,
    .calendar-slot,
    .calendar-timeline-slot,
    .ft-input,
    .badge,
    .toast {
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .sidebar-bg { background: rgba(10,10,14,.78); }
    .bottom-nav-bg { background: rgba(12,12,18,.88); }
    .modal-bg { background: rgba(10,10,16,.88); }

    .nav-link {
      display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 14px;
      font-size: 13.5px; font-weight: 500; color: #A8A8C2; text-decoration: none;
      transition: all var(--tr); white-space: nowrap;
    }
    .nav-link:hover { color: #FFFFFF; background: rgba(255,255,255,.06); }
    .nav-link.active { color: #FFFFFF; background: rgba(212,175,55,.14); }
    .nav-link.active i { color: var(--gold); }

    .bnav-link { flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 10px 4px 12px; text-decoration: none;
      font-size: 10px; font-weight: 600; color: #8A8AB2; transition: color var(--tr);
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      background: transparent; border: none; cursor: pointer; pointer-events: auto;
    }
    .bnav-link:hover, .bnav-link.active { color: var(--gold); }
    .bnav-link:active { transform: scale(0.88); transition: transform .12s ease; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: all var(--tr); border: none; outline: none;
    }
    .btn:active { transform: scale(0.95); }
    .btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 12px; }
    .btn-icon { padding: 9px; }

    .btn-gold {
      background: linear-gradient(135deg, rgba(212,175,55,.95), rgba(229,169,60,.92));
      color: #080706;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      box-shadow: 0 0 28px rgba(212,175,55,.26), inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 0 38px rgba(212,175,55,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
    .btn-gold:active { transform: scale(0.95); }

    .btn-ghost {
      background: rgba(255,255,255,.06); color: #C4C4D4;
      border: 1px solid rgba(255,255,255,.10);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.10); color: #FFFFFF; }

    .btn-danger { background: rgba(244,63,94,.12); color: #FBB2C1; }
    .btn-danger:hover { background: rgba(244,63,94,.18); }

    .btn-emerald { background: rgba(16,185,129,.12); color: #8EE7B8; }
    .btn-emerald:hover { background: rgba(16,185,129,.18); }

    .ft-input {
      width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #F5F5FB;
      font-family: inherit; transition: all var(--tr); outline: none;
    }
    .ft-input:focus { border-color: rgba(212,175,55,.42); background: rgba(255,255,255,.09); box-shadow: 0 0 0 3px rgba(212,175,55,.10); }
    .ft-input::placeholder { color: #7B7B8F; }
    .ft-input option { background: rgba(255,255,255,.08); color: #F4F4F8; }

    .ft-label { display:block; font-size:11.5px; font-weight:700; color:#7B7B8F; margin-bottom:7px; letter-spacing:.03em; }

    .card, .stat-card { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius: 24px; padding: 22px; transition: all var(--tr); }
    .card:hover, .stat-card:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.14); }

    .badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.04em; }
    .badge-active { background: rgba(16,185,129,.16); color: #9BE7C2; }
    .badge-pause  { background: rgba(245,158,11,.16); color: #FFD166; }
    .badge-wl { background: rgba(96,165,250,.16); color: #93C5FD; }
    .badge-mg { background: rgba(52,211,153,.16); color: #6EE7B7; }
    .badge-df { background: rgba(245,158,11,.16); color: #FCD34D; }
    .badge-hl { background: rgba(167,139,250,.16); color: #C4B5FD; }

    .avatar { border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; flex-shrink: 0; letter-spacing: -.02em; font-size: 15px;
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }

    .mbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); overflow:hidden; }
    .mbar-fill { height:100%; border-radius:999px; transition: width .7s cubic-bezier(.4,0,.2,1); }

    .chart-wrap { position:relative; height:220px; }

    .toast { pointer-events: all; display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: 18px; font-size: 13.5px; font-weight: 500;
      box-shadow: 0 18px 48px rgba(0,0,0,.35); animation: slideToast .25s ease;
      backdrop-filter: blur(16px); max-width: 320px; width: max-content;
    }
    .toast-ok  { background: rgba(16,185,129,.14); border:1px solid rgba(16,185,129,.25); color:#A8FFE6; }
    .toast-err { background: rgba(244,63,94,.16); border:1px solid rgba(244,63,94,.25); color:#FFB6C1; }
    .toast-info{ background: rgba(212,175,55,.16); border:1px solid rgba(212,175,55,.25); color:#FFF1C2; }

    @keyframes slideToast { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

    .page-enter { animation: pageIn .25s ease forwards; }
    @keyframes pageIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

    .divider { border:none; border-top:1px solid rgba(255,255,255,.08); margin:16px 0; }

    .slabel { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7C7C96; margin-bottom:12px; }

    .ft-table { width:100%; border-collapse:collapse; }
    .ft-table th { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#7C7C96; padding:10px 12px; text-align:left; }
    .ft-table td { padding:10px 12px; font-size:13.5px; border-top:1px solid rgba(255,255,255,.08); color:#D8D8E8; }
    .ft-table tr:hover td { background: rgba(255,255,255,.04); }

    .client-card { cursor:pointer; transition: all var(--tr); border-radius:18px; }
    .client-card:hover { background: rgba(255,255,255,.06); }

    .calendar-day { min-height:64px; border-radius:18px; padding:14px; transition:background var(--tr), border-color var(--tr); }
    .calendar-day:hover { background: rgba(255,255,255,.08); }
    .calendar-day.selected { background: rgba(255,255,255,.08); border-color: rgba(212,175,55,.25); }
    .calendar-day.warn { border-color: rgba(249,115,22,.35); }

    .calendar-dot { width:8px; height:8px; border-radius:999px; background: #03C5FD; box-shadow: 0 0 0 2px rgba(3,197,253,.18); }
    .calendar-event-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:#E5E7EB; font-size:12px; }
    .calendar-event-pill.alert { background: rgba(249,115,22,.12); color: #FBBF24; }

    .calendar-event-card { background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:14px; transition: transform var(--tr), border-color var(--tr), background-color var(--tr); }
    .calendar-event-card:hover { transform: translateY(-1px); border-color: rgba(212,175,55,.3); }
    .calendar-event-card.warn { background: rgba(249,115,22,.20); border-color: rgba(249,115,22,.35); color: #FDE68A; }
    .calendar-event-card.warn .event-time, .calendar-event-card.warn .event-name, .calendar-event-card.warn .text-gray-400 { color: #FDE68A !important; }

    .calendar-timeline-slot { display:grid; grid-template-columns:64px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .calendar-hour { color:#9CA3AF; font-size:12px; min-width:64px; }

    .calendar-grid-month { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; }
    .calendar-day.lead, .calendar-day.tail { opacity:0.25; }

    .dragging { opacity: .6; transform: scale(.995); }
    .calendar-slot { min-height:48px; display:flex; align-items:center; padding:8px; border-radius:14px; }
    .calendar-slot.drop-over { outline: 2px dashed rgba(212,175,55,.35); }

    .week-grid { width:100%; }
    .week-grid .calendar-day { padding:12px; }
    .week-grid .calendar-event-card { padding:14px; border-radius:16px; }
    .week-grid .calendar-event-card .event-name { line-height:1.1; }
    .week-grid .calendar-event-card .event-time { font-size:12px; color: #E5E7EB; }
    .week-grid .calendar-event-card .event-count { color: #A5A8BF; }

    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    @media (max-width:1023px) { #content { padding-bottom: 82px; } }
    @media (max-width: 640px) {
      .nav-link { font-size: 12.5px; padding: 10px 12px; }
      .card, .stat-card { padding: 18px; }
    }

    @media print { #app, #bottom-nav, #toasts, #modal-overlay { display:none !important; } #print-wrap { display:block !important; } body { background: white !important; color: black !important; } }
  </style>
</head>
<body class="bg-[#0D0D11] text-gray-100 font-sans antialiased overflow-hidden">

<div id="auth-screen" class="hidden fixed inset-0 z-[99999] bg-surf-950 flex items-center justify-center p-4">

const DB = {
  _d: null,
  _realtimeCh: null,

  // Завантажує всі дані з Supabase у пам'ять
  async _loadAll() {
    const [c, s, f, n, p] = await Promise.all([
      SUPA.from('clients').select('id,payload').eq('user_id', _uid),
      SUPA.from('schedules').select('id,payload').eq('user_id', _uid),
      SUPA.from('financial_transactions').select('id,payload').eq('user_id', _uid),
      SUPA.from('quick_notes').select('id,payload').eq('user_id', _uid),
      SUPA.from('partner_requests').select('id,payload').eq('user_id', _uid),
    ]);
    this._d = {
      clients:               (c.data||[]).map(r=>r.payload),
      schedules:             (s.data||[]).map(r=>r.payload),
      financialTransactions: (f.data||[]).map(r=>r.payload),
      quickNotes:            (n.data||[]).map(r=>r.payload),
      partnerRequests:       (p.data||[]).map(r=>r.payload),
      theme:    localStorage.getItem('fittrack_theme') || 'dark',
      knowledge: DEFAULT_DATA.knowledge,
    };
  },

  // Підписка на зміни з інших пристроїв — оновлює кеш і перемальовує поточний вигляд
  _subscribeRealtime() {
    if (this._realtimeCh) SUPA.removeChannel(this._realtimeCh);
    const reload = async () => { await this._loadAll(); Router._go(); };
    this._realtimeCh = SUPA.channel('fittrack-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'clients'},            reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'schedules'},           reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'financial_transactions'}, reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'quick_notes'},         reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'partner_requests'},    reload)
      .subscribe();
  },

  async init(user) {
    _uid = user.id;
    await this._loadAll();
    this._subscribeRealtime();
  },

  // ── Всі GET — синхронні (читають з кешу) ───────────────────────────────────
  getTheme()  { return this._d?.theme || 'dark'; },
  setTheme(t) { this._d.theme = t; localStorage.setItem('fittrack_theme', t); },

  getClients()  { return this._d?.clients || []; },
  getClient(id) { return (this._d?.clients||[]).find(c=>c.id===id)||null; },

  getSchedules()             { return this._d?.schedules||[]; },
  getSchedule(id)            { return (this._d?.schedules||[]).find(e=>e.id===id)||null; },
  getSchedulesForDay(date)   { return (this._d?.schedules||[]).filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||'')); },
  getFinancialTransactions() { return this._d?.financialTransactions||[]; },
  getNotes()                 { return this._d?.quickNotes||[]; },
  getPartnerRequests()       { return this._d?.partnerRequests||[]; },
  getKnowledge()             { return this._d?.knowledge||DEFAULT_DATA.knowledge; },

  // ── Запис — оновлює кеш + пише у Supabase асинхронно ──────────────────────
  _up(table, id, payload) {
    SUPA.from(table).upsert({id, user_id:_uid, payload, updated_at:new Date().toISOString()})
      .then(({error})=>{ if(error) console.error(table, error); });
  },
  _del(table, id) {
    SUPA.from(table).delete().eq('id',id).eq('user_id',_uid)
      .then(({error})=>{ if(error) console.error(table,'del',error); });
  },

  saveClient(c) {
    if(!this._d.clients) this._d.clients=[];
    const i=this._d.clients.findIndex(x=>x.id===c.id);
    if(i>=0) this._d.clients[i]=c; else this._d.clients.unshift(c);
    this._up('clients',c.id,c);
  },
  deleteClient(id) {
    this._d.clients=(this._d.clients||[]).filter(c=>c.id!==id);
    this._del('clients',id);
  },

  addWeight(clientId,date,weight) {
    const c=this.getClient(clientId); if(!c) return;
    c.weightHistory=(c.weightHistory||[]).filter(e=>e.date!==date);
    c.weightHistory.push({date,weight});
    c.weightHistory.sort((a,b)=>a.date.localeCompare(b.date));
    c.currentWeight=weight;
    this.saveClient(c);
  },
  deleteWeight(clientId,date) {
    const c=this.getClient(clientId); if(!c) return;
    c.weightHistory=(c.weightHistory||[]).filter(e=>e.date!==date);
    if(c.weightHistory.length) c.currentWeight=c.weightHistory[c.weightHistory.length-1].weight;
    this.saveClient(c);
  },

  saveNote(n) {
    if(!this._d.quickNotes) this._d.quickNotes=[];
    const i=this._d.quickNotes.findIndex(x=>x.id===n.id);
    if(i>=0) this._d.quickNotes[i]=n; else this._d.quickNotes.unshift(n);
    this._up('quick_notes',n.id,n);
  },
  deleteNote(id) {
    this._d.quickNotes=(this._d.quickNotes||[]).filter(n=>n.id!==id);
    this._del('quick_notes',id);
  },

  saveFinancialTransaction(t) {
    if(!this._d.financialTransactions) this._d.financialTransactions=[];
    t.id=t.id||this.uid();
    const idx=this._d.financialTransactions.findIndex(x=>x.id===t.id);
    if(idx>=0) this._d.financialTransactions[idx]=t; else this._d.financialTransactions.unshift(t);
    this._up('financial_transactions',t.id,t);
  },

  addSessionsToClient(clientId,count) {
    const c=this.getClient(clientId); if(!c) return;
    if(typeof c.remainingSessions!=='number') c.remainingSessions=0;
    c.remainingSessions+=Number(count)||0;
    this.saveClient(c);
  },

  savePartnerRequest(r) {
    if(!this._d.partnerRequests) this._d.partnerRequests=[];
    r.id=r.id||this.uid();
    const idx=this._d.partnerRequests.findIndex(x=>x.id===r.id);
    if(idx>=0) this._d.partnerRequests[idx]=r; else this._d.partnerRequests.unshift(r);
    this._up('partner_requests',r.id,r);
  },
  deletePartnerRequest(id) {
    this._d.partnerRequests=(this._d.partnerRequests||[]).filter(r=>r.id!==id);
    this._del('partner_requests',id);
  },

  _calcEndTime(time) {
    if(!time||!/^\d{2}:\d{2}$/.test(time)) return '00:00';
    const [h,m]=time.split(':').map(Number);
    const dt=new Date(); dt.setHours(h); dt.setMinutes(m+60);
    return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  },
  _normalizeSchedule(ev) {
    if(!ev.time&&ev.startTime) ev.time=ev.startTime;
    if(!ev.endTime&&ev.time) ev.endTime=this._calcEndTime(ev.time);
    return ev;
  },
  saveSchedule(ev) {
    if(!this._d.schedules) this._d.schedules=[];
    ev=this._normalizeSchedule(ev);
    const idx=this._d.schedules.findIndex(x=>x.id===ev.id);
    if(idx>=0) {
      const existing=this._d.schedules[idx];
      if(!existing.status==='done'&&ev.status==='done'&&!ev.sessionUsed) ev.sessionUsed=this._consumeSession(ev.clientId);
      this._d.schedules[idx]=ev;
    } else {
      ev.id=ev.id||this.uid();
      ev.sessionUsed=ev.sessionUsed??this._consumeSession(ev.clientId);
      this._d.schedules.unshift(ev);
    }
    this._up('schedules',ev.id,ev);
  },
  deleteSchedule(id) {
    this._d.schedules=(this._d.schedules||[]).filter(e=>e.id!==id);
    this._del('schedules',id);
  },
  completeSchedule(id) {
    const ev=this.getSchedule(id); if(!ev||ev.status==='done') return;
    ev.status='done';
    if(!ev.sessionUsed) ev.sessionUsed=this._consumeSession(ev.clientId);
    this.saveSchedule(ev);
  },
  _consumeSession(clientId) {
    const c=this.getClient(clientId); if(!c) return false;
    if(typeof c.remainingSessions!=='number') c.remainingSessions=0;
    if(c.remainingSessions>0) { c.remainingSessions=Math.max(0,c.remainingSessions-1); this.saveClient(c); return true; }
    return false;
  },
  uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); },
};

const Calc = {
  bmr(gender, weight, height, age) {
    const b = 10*weight + 6.25*height - 5*age;
    return Math.round(gender === 'male' ? b+5 : b-161);
  },
  tdee(bmr, act) { return Math.round(bmr * act); },
  goalKcal(tdee, goal) { return Math.round(tdee + (GOALS[goal]?.offset ?? 0)); },

  macros(kcal, goal, weight) {
    let pG, fatPct;
    switch(goal) {
      case 'weight_loss': pG = weight*2.2; fatPct = .25; break;
      case 'muscle_gain': pG = weight*2.0; fatPct = .30; break;
      case 'definition':  pG = weight*2.5; fatPct = .20; break;
      default:            pG = weight*1.6; fatPct = .30;
    }
    pG = Math.round(pG);
    const fG = Math.round((kcal * fatPct) / 9);
    const cG = Math.max(20, Math.round((kcal - pG*4 - fG*9) / 4));
    return {protein:pG, fat:fG, carbs:cG};
  },

  bmi(w, h) { return (w / ((h/100)**2)).toFixed(1); },
  bmiLabel(v) {
    if (v < 18.5) return ['Недостатня вага','#60A5FA'];
    if (v < 25)   return ['Норма',          '#34D399'];
    if (v < 30)   return ['Надмірна вага',  '#FBB040'];
    return               ['Ожиріння',       '#F87171'];
  },

  run(p) {
    const bmr  = this.bmr(p.gender, p.weight, p.height, p.age);
    const tdee = this.tdee(bmr, p.activityLevel);
    const kcal = this.goalKcal(tdee, p.goal);
    const macros = this.macros(kcal, p.goal, p.weight);
    const bmiVal = parseFloat(this.bmi(p.weight, p.height));
    const [bmiLabel, bmiColor] = this.bmiLabel(bmiVal);
    return {bmr, tdee, kcal, macros, bmi:bmiVal, bmiLabel, bmiColor};
  },
};

const Utils = {
  fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('uk-UA',{day:'numeric',month:'short',year:'numeric'});
  },
  fmtShort(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('uk-UA',{day:'numeric',month:'short'});
  },
  today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  initials(name) {
    const p = (name||'').trim().split(/\s+/);
    return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : (p[0]||'?')[0].toUpperCase();
  },
  grad(name) {
    let h = 0;
    for (let i=0; i<(name||'').length; i++) h = ((h<<5)-h+name.charCodeAt(i))|0;
    const [a,b] = GRAD[Math.abs(h) % GRAD.length];
    return `linear-gradient(135deg,${a},${b})`;
  },
  avatar(name, size=40, r='11px') {
    const fs = Math.round(size*.38);
    return `<div class="avatar" style="width:${size}px;height:${size}px;border-radius:${r};background:${this.grad(name)};font-size:${fs}px">${this.initials(name)}</div>`;
  },
  delta(history) {
    if (!history || history.length < 2) return null;
    const s = [...history].sort((a,b)=>a.date.localeCompare(b.date));
    return +(s[s.length-1].weight - s[0].weight).toFixed(1);
  },
  validate(val, min, max, name) {
    const n = parseFloat(val);
    if (isNaN(n)||n<min||n>max) throw new Error(`${name}: введіть число від ${min} до ${max}`);
    return n;
  },
  esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },
};

let _chart = null;

const Router = {
  init() {
    window.addEventListener('hashchange', () => this._go());
    this._go();
  },
  _go(forceHash) {
    Modal.close();
    if (_chart) { try{_chart.destroy();}catch{} _chart=null; }
    const hash = forceHash || location.hash.replace('#','') || 'dashboard';
    const [view, param] = hash.split('/');
    const map = {
      dashboard:  ()=>Views.Dashboard.render(),
      clients:    ()=>Views.Clients.render(),
      partners:   ()=>Views.Partners.render(),
      finances:   ()=>Views.Finances.render(),
      calculator: ()=>Views.Calculator.render(),
      knowledge:  ()=>Views.Knowledge.render(),
      calendar:   ()=>Views.Calendar.render(),
      client:     ()=>Views.ClientDetail.render(param),
    };
    (map[view] || map.dashboard)();
    this._nav(view, param);
  },
  _nav(view, param) {
    const isDetail = view==='client' && param;
    document.querySelectorAll('[data-view]').forEach(el=>{
      el.classList.toggle('active', isDetail ? el.dataset.view==='clients' : el.dataset.view===view);
    });
    const bb = document.getElementById('back-btn');
    if (bb) bb.classList.toggle('hidden', !isDetail);
  },
  go(hash) {
    if (this._busy === hash) return;
    this._busy = hash; setTimeout(()=>{ this._busy = null; }, 500);
    try { history.replaceState(null, '', '#' + hash); } catch(e) { location.hash = hash; }
    this._go(hash);
  },
};

function buildChart(canvasId, history, target, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const sorted = [...history].sort((a,b)=>a.date.localeCompare(b.date));
  const labels = sorted.map(e=>Utils.fmtShort(e.date));
  const data   = sorted.map(e=>e.weight);
  const ctx    = canvas.getContext('2d');
  const grad   = ctx.createLinearGradient(0,0,0,220);
  grad.addColorStop(0, color+'55');
  grad.addColorStop(1, color+'00');
  if (_chart) { try{_chart.destroy();}catch{} }
  _chart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'Вага (кг)', data, borderColor:color, borderWidth:2.5,

      responsive:true, maintainAspectRatio:false,

      plugins:{

      },
    },
  });
}

        <button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button>

      <label class="ft-label">Текст нотатки</label>
      <textarea id="nt" class="ft-input" rows="3" placeholder="Наприклад: нагадати клієнту про зважування…"></textarea>
      <div class="flex gap-2 mt-4">

        <button onclick="Views.Dashboard._saveNote()" class="btn btn-gold flex-1">Додати</button>
      </div>
    </div>`);
  },

  _saveNote() {
    const text = document.getElementById('nt').value.trim();
    if (!text) { Toast.show('Введіть текст нотатки','err'); return; }
    DB.saveNote({id:DB.uid(),text,done:false});

  _toggle(id) {
    const n = DB.getNotes().find(x=>x.id===id);
    if (n) { n.done=!n.done; DB.saveNote(n); this.render(); }
  },

  _delNote(id) { DB.deleteNote(id); this.render(); Toast.show('Нотатку видалено'); },
};

  _save(eid) {

      if (!name) throw new Error('Введіть ПІБ клієнта');
      const age    = Utils.validate(document.getElementById('cf-age').value,10,100,'Вік');
      const height = Utils.validate(document.getElementById('cf-height').value,100,250,'Зріст');
      const weight = Utils.validate(document.getElementById('cf-weight').value,30,300,'Поточна вага');
      const target = Utils.validate(document.getElementById('cf-target').value,30,300,'Цільова вага');
      const ex     = eid ? DB.getClient(eid) : null;
      const start  = document.getElementById('cf-start').value || Utils.today();
      const client = {
        id: ex ? ex.id : DB.uid(), name,
        phone: document.getElementById('cf-phone').value.trim(), email:'',
        gender: document.getElementById('cf-gender').value, age, height,
        currentWeight: weight, targetWeight: target,
        goal: document.getElementById('cf-goal').value,
        activityLevel: parseFloat(document.getElementById('cf-act').value),
        startDate: start, status: document.getElementById('cf-status').value,
        remainingSessions: parseInt(document.getElementById('cf-sessions').value,10) || 0,
        package: document.getElementById('cf-package').value.trim(),
        notes: document.getElementById('cf-notes').value.trim(),
        weightHistory: ex ? ex.weightHistory : [{date:start,weight}],
      };
      DB.saveClient(client);
      if (!ex && client.startDate) {
        const existing = DB.getSchedulesForDay(client.startDate).some(s=>s.clientId===client.id && s.time==='18:00');
        if (!existing) {
          DB.saveSchedule({ clientId: client.id, date: client.startDate, time: '18:00', status: 'scheduled', notes: 'Автоматичний запис при створенні клієнта' });
        }
      }
      Modal.close();
      if (document.getElementById('clist')) this.render(); else { const c=DB.getClient(client.id); if(c) Views.ClientDetail.render(c.id); }
      Toast.show(ex?'Дані клієнта оновлено':'Клієнта додано!');
    } catch(e) { Toast.show(e.message,'err'); }
  },
};

      function renderClients(q){
        const clients = DB.getClients();
        const ql = (q||'').toLowerCase();

        requestsWrapper.innerHTML = reqs.map(r=>{
          const matches = reqs.filter(o=>o.id!==r.id && o.date===r.date && Math.abs(toMinutes(o.time)-toMinutes(r.time)) <= 60);
          const match = matches[0];
          const matchedClass = matches.length ? 'border-emerald-400/20 bg-emerald-500/10' : 'border-white/10 bg-white/5';
          const client = DB.getClient(r.clientId);
          return `<div class="rounded-xl border ${matchedClass} p-3">

              <button data-action="share" data-id="${r.id}" class="btn btn-sm btn-ghost">Поділитися в Telegram</button>

        }).join('');
        requestsWrapper.querySelectorAll('button[data-action]').forEach(btn=>{
          btn.addEventListener('click', (e)=>{
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            if(action==='match'){
              const matchId = btn.dataset.match;
              if(!matchId) return;
              Views.Finances._combinePartnerRequests(id, matchId);
            }
            if(action==='share') Views.Finances._copyPartnerInvite(id);
          });
        });

            finalClientId = id;
            Toast.show('Клієнта створено');
          }

        DB.savePartnerRequest({ clientId: finalClientId, clientName, date, time, notes });
        hid.value = '';

  _combinePartnerRequests(reqId, matchId) {
    const req = DB.getPartnerRequests().find(r=>r.id===reqId);
    const match = DB.getPartnerRequests().find(r=>r.id===matchId);
    if(!req || !match) return;
    const clientA = DB.getClient(req.clientId);
    const clientB = DB.getClient(match.clientId);
    if(!clientA || !clientB) return;
    const schedule = {
      id: DB.uid(),
      clientId: clientA.id,
      partnerIds: [clientB.id],
      date: req.date,
      time: req.time,
      endTime: this._defaultEnd(req.time),
      status: 'scheduled',
      type: 'pair',
      notes: `Парне тренування з ${clientB.name}`,
    };
    DB.saveSchedule(schedule);
    DB.addSessionsToClient(clientA.id, -0.7);
    DB.addSessionsToClient(clientB.id, -0.7);
    DB.deletePartnerRequest(req.id);
    DB.deletePartnerRequest(match.id);
    Modal.close();
    this.render();
    Toast.show('Парне тренування створено');
  },

  _copyPartnerInvite(reqId) {
    const req = DB.getPartnerRequests().find(r=>r.id===reqId);
    if(!req) return;
    const client = DB.getClient(req.clientId);
    const dayName = new Date(req.date).toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
    const text = `Привіт! 💪 Для тебе є крута пара на парне тренування у ${dayName} о ${req.time}! 🌟\n\n👤 Партнер: ${client?.name||req.clientName}\n📅 Дата: ${Utils.fmtDate(req.date)}\n🕐 Час: ${req.time}\n${req.notes ? '📝 Побажання: '+req.notes+'\n' : ''}\nПарне тренування — це мотивація, підтримка та кращий результат! Підтверди участь і побачимось на тренуванні 🏋️‍♀️🏋️`;
    navigator.clipboard.writeText(text).then(()=>Toast.show('✅ Текст скопійовано! Відправ клієнту в Telegram')).catch(()=>Toast.show('Не вдалося скопіювати','err'));
  },

  _defaultEnd(start) {
    if (!/^\d{2}:\d{2}$/.test(start)) return '00:00';
    const [h,m] = start.split(':').map(Number);
    const dt = new Date(); dt.setHours(h); dt.setMinutes(m + 60);
    return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  },

  _formatInterval(ev) {
    const start = ev.time || ev.startTime || '00:00';
    const end = ev.endTime || this._defaultEnd(start);
    return `${start} - ${end}`;
  },
};

        <div class="space-y-2.5">

        <div class="flex items-center justify-between mb-3">

  _mrow(label, g, cpg, color, total) {
    const pct = Math.round((g*cpg/total)*100);
    return `<div><div class="flex items-center justify-between mb-1"><span class="text-xs text-gray-400">${label}</span><div class="flex items-center gap-2"><span class="text-xs font-semibold text-white">${g} г</span><span class="text-xs text-gray-600">${pct}%</span></div></div><div class="mbar"><div class="mbar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
  },

  _wtable(c) {
    const rows = [...(c.weightHistory||[])].sort((a,b)=>b.date.localeCompare(a.date));
    if (!rows.length) return `<div class="text-sm text-gray-600 text-center py-4">Записів поки немає.</div>`;
    return `<table class="ft-table"><thead><tr><th>Дата</th><th>Вага</th><th>Зміна</th><th></th></tr></thead><tbody>${rows.map((e,i)=>{const prev=rows[i+1];const diff=prev?(e.weight-prev.weight).toFixed(1):null;return `<tr><td class="text-gray-300">${Utils.fmtDate(e.date)}</td><td class="font-semibold text-white">${e.weight} кг</td><td class="font-medium ${diff===null?'text-gray-600':parseFloat(diff)<0?'text-emerald-400':'text-rose-400'}">${diff!==null?(parseFloat(diff)>0?'+':'')+diff+' кг':'—'}</td><td class="text-right"><button onclick="Views.ClientDetail._delW('${c.id}','${e.date}')" class="btn btn-icon btn-danger" style="padding:4px"><i data-lucide="trash-2" class="w-3 h-3"></i></button></td></tr>`;}).join('')}</tbody></table>`;
  },

  _addW(cid) {
    Modal.open(`<div class="p-5"><div class="flex items-center justify-between mb-4"><div class="font-bold text-white">Додати зважування</div><button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="space-y-3"><div><label class="ft-label">Дата</label><input id="wd" class="ft-input" type="date" value="${Utils.today()}"></div><div><label class="ft-label">Вага (кг)</label><input id="wv" class="ft-input" type="number" min="30" max="300" step="0.1" placeholder="72.5"></div></div><div class="flex gap-2 mt-4"><button onclick="Modal.close()" class="btn btn-ghost flex-1">Скасувати</button><button onclick="Views.ClientDetail._saveW('${cid}')" class="btn btn-gold flex-1">Зберегти</button></div></div>`);
  },

  _saveW(cid) {
    try { const date = document.getElementById('wd').value; if (!date) throw new Error('Оберіть дату'); const w = Utils.validate(document.getElementById('wv').value,30,300,'Вага'); DB.addWeight(cid,date,w); Modal.close(); this.render(cid); Toast.show('Зважування збережено'); } catch(e) { Toast.show(e.message,'err'); }
  },

  _delW(cid,date) { DB.deleteWeight(cid,date); this.render(cid); Toast.show('Запис видалено'); },

  _del(id) { const c=DB.getClient(id); Modal.open(`<div class="p-5"><div class="flex items-center justify-between mb-3"><div class="font-bold text-white">Видалити клієнта?</div><button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button></div><p class="text-sm text-gray-400 mb-5">Ви видаляєте <strong class="text-white">${Utils.esc(c.name)}</strong>. Всі дані, включно з журналом ваги, будуть втрачені назавжди.</p><div class="flex gap-2"><button onclick="Modal.close()" class="btn btn-ghost flex-1">Скасувати</button><button onclick="Views.ClientDetail._doDelete('${id}')" class="btn btn-danger flex-1">Видалити</button></div></div>`); },
  _doDelete(id) { DB.deleteClient(id); Modal.close(); Router.go('clients'); Toast.show('Клієнта видалено'); },
};

        </div>

          <textarea id="pr-notes" class="ft-input" rows="3" placeholder="Наприклад: шукаю партнера близько 28-35 років, досвід понад 2 роки, тренування на виносливість..."></textarea>

      </div>

        <button onclick="Modal.close()" class="btn btn-ghost flex-1">Скасувати</button>
        <button id="pr-create-btn" class="btn btn-gold flex-1">Створити заявку</button>
      </div>
    </div>`);

    (function(){
      const search = document.getElementById('pr-client-search');
      const hid = document.getElementById('pr-client');
      const list = document.getElementById('pr-client-list');
      const createBtn = document.getElementById('pr-create-btn');
      const dateInput = document.getElementById('pr-date');
      const timeInput = document.getElementById('pr-time');
      const notesInput = document.getElementById('pr-notes');

      function renderClients(q){
        const clients = DB.getClients();
        const ql = (q||'').toLowerCase();
        const matches = clients.filter(c=>c.name.toLowerCase().includes(ql) || (c.phone||'').includes(ql)).slice(0,20);
        if(!matches.length){ list.classList.add('hidden'); list.innerHTML = ''; return; }
        list.classList.remove('hidden');
        list.innerHTML = matches.map(c=>`<div class="px-3 py-2 cursor-pointer hover:bg-white/5 text-sm" data-id="${c.id}" data-name="${Utils.esc(c.name)}">${Utils.esc(c.name)}</div>`).join('');
        list.querySelectorAll('div[data-id]').forEach(el=>el.addEventListener('click', ()=>{ hid.value = el.dataset.id; search.value = el.dataset.name; list.classList.add('hidden'); }));
      }

      search.addEventListener('input', e=>{ hid.value=''; renderClients(e.target.value); });
      search.addEventListener('focus', ()=>renderClients(search.value));
      document.addEventListener('click', e=>{ if(!e.target.closest('#pr-client-list') && !e.target.closest('#pr-client-search')) list.classList.add('hidden'); });

      createBtn.addEventListener('click', ()=>{
        const clientId = hid.value;
        const clientName = (search.value||'').trim();
        if(!clientName){ Toast.show('Введіть імʼя клієнта','err'); return; }
        const date = dateInput.value || today;
        const time = timeInput.value || '18:00';
        const notes = notesInput.value.trim();
        
        let finalClientId = clientId;
        if(!finalClientId){
          const existing = DB.getClients().find(c=> (c.name||'').trim().toLowerCase() === clientName.toLowerCase());
          if(existing) finalClientId = existing.id; else {
            const id = DB.uid();
            DB.saveClient({ id, name: clientName, phone:'', email:'', gender:'male', age:0, height:0, currentWeight:0, targetWeight:0, goal:'', activityLevel:1, startDate:today, status:'active', remainingSessions:0, package:'', notes:'', weightHistory:[] });
            finalClientId = id;
            Toast.show('Клієнта автоматично створено');
          }
        }
        DB.savePartnerRequest({ clientId: finalClientId, clientName, date, time, notes });
        Modal.close();
        Views.Partners.render();
        Toast.show('Заявку додано! 🎯');
      });
    })();
  },

  combineRequests(reqId, matchId) {
    const req = DB.getPartnerRequests().find(r=>r.id===reqId);
    const match = DB.getPartnerRequests().find(r=>r.id===matchId);
    if(!req || !match) return;
    const clientA = DB.getClient(req.clientId);
    const clientB = DB.getClient(match.clientId);
    if(!clientA || !clientB) return;
    
    const schedule = {
      id: DB.uid(),
      clientId: clientA.id,
      partnerIds: [clientB.id],
      date: req.date,
      time: req.time,
      endTime: Views.Finances._defaultEnd(req.time),
      status: 'scheduled',
      type: 'pair',
      notes: `Парне тренування з ${clientB.name}`,
    };
    DB.saveSchedule(schedule);
    DB.addSessionsToClient(clientA.id, -0.7);
    DB.addSessionsToClient(clientB.id, -0.7);
    DB.deletePartnerRequest(req.id);
    DB.deletePartnerRequest(match.id);
    Views.Partners.render();
    Toast.show('✅ Парне тренування створено! 0.7 заняття списано з кожного клієнта.');
  },

  shareInvite(reqId) {
    const req = DB.getPartnerRequests().find(r=>r.id===reqId);
    if(!req) return;
    const client = DB.getClient(req.clientId);
    const dayName = new Date(req.date).toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
    const text = `Привіт! 💪 Для тебе є крута пара на парне тренування у ${dayName} о ${req.time}! 🌟\n\n👤 Партнер: ${client?.name || req.clientName}\n📅 Дата: ${Utils.fmtDate(req.date)}\n🕐 Час: ${req.time}\n${req.notes ? '📝 Побажання: '+req.notes+'\n' : ''}\nПарне тренування — це мотивація, підтримка та кращий результат! Підтверди участь і побачимось на тренуванні 🏋️‍♀️🏋️`;
    navigator.clipboard.writeText(text).then(()=>Toast.show('✅ Текст скопійовано! Відправ клієнту в Telegram')).catch(()=>Toast.show('Не вдалося скопіювати','err'));
  },

  deleteRequest(reqId) {
    DB.deletePartnerRequest(reqId);
    Views.Partners.render();
    Toast.show('Заявку видалено');
  },
};

Views.Calendar = {
  _mode:'day',
  _date: Utils.today(),

  render(date) {
    if (date) this._date = date;
    const today = Utils.today();
    this._date = this._date || today;
    const events = DB.getSchedules().sort((a,b)=>a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
    const todayEvents = events.filter(e=> e.date === today);
    const lastSessionAlert = events.some(e=> { const c = DB.getClient(e.clientId); return c && c.remainingSessions === 1; });
    const monthLabel = new Date(this._date).toLocaleDateString('uk-UA',{month:'long',year:'numeric'});

    document.getElementById('content').innerHTML = `
    <div class="p-3 md:p-4 w-full max-w-none page-enter space-y-4">

      <div class="flex items-start justify-between gap-2">
        <div>
          <h1 class="text-xl font-bold text-white">Календар тренувань</h1>
          <div class="text-xs text-gray-500 mt-1">${this._mode==='day'?'День':this._mode==='week'?'Тиждень':'Місяць'} · ${this._mode==='month'?monthLabel:Utils.fmtDate(this._date)}</div>
        </div>
        <button onclick="Views.Calendar._openAddModal('${this._date}')" class="btn btn-gold btn-sm shrink-0">+ Запис</button>
      </div>
      <div class="flex justify-center gap-2">
        <button onclick="Views.Calendar._setMode('day')" class="btn btn-sm ${this._mode==='day'?'btn-gold':'btn-ghost'}">День</button>
        <button onclick="Views.Calendar._setMode('week')" class="btn btn-sm ${this._mode==='week'?'btn-gold':'btn-ghost'}">Тиждень</button>
        <button onclick="Views.Calendar._setMode('month')" class="btn btn-sm ${this._mode==='month'?'btn-gold':'btn-ghost'}">Місяць</button>
      </div>
      <div class="flex justify-center items-center gap-3">
        <button onclick="Views.Calendar._prev()" class="btn btn-sm btn-ghost"><i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i></button>
        <button onclick="Views.Calendar._next()" class="btn btn-sm btn-ghost"><i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i></button>
      </div>

      <div class="grid lg:grid-cols-[1fr_300px] gap-2">
        <div class="space-y-4">
          ${this._mode==='day' ? this._dayView(DB.getSchedulesForDay(this._date)) : this._mode==='week' ? this._weekView() : this._monthView()}
        </div>
        <div class="card p-4 space-y-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-xs text-gray-500">Всього тренувань</div>
              <div class="text-2xl font-bold text-white">${events.length}</div>
            </div>
            <div class="text-right">
              <div class="text-xs text-gray-500">Сьогодні</div>
              <div class="text-xl font-semibold text-white">${todayEvents.length}</div>
            </div>
          </div>
          ${lastSessionAlert?`<div class="rounded-xl border border-amber-400/20 bg-amber-500/10 p-3 text-amber-100 text-sm">Є клієнти з останніми заняттями. Слід попередити або поповнити пакет.</div>`:''}
          <div>
            <div class="text-xs text-gray-500 mb-2">Поточні броні (ті, у кого останнє заняття)</div>
              <div id="mini-bookings" class="space-y-3">${(DB.getSchedulesForDay(this._date) || []).filter(e=>{ const c = DB.getClient(e.clientId); return c && c.remainingSessions===1; }).map(e=>{ const c = DB.getClient(e.clientId); return `<div class="calendar-event-card warn"><div class="flex items-center justify-between gap-3"><div class="min-w-0"><div class="text-xs font-semibold text-white">${Utils.esc(c?.name||'Клієнт')}</div><div class="text-xs text-gray-400">${Utils.fmtDate(e.date)} · <span class="whitespace-nowrap">${this._formatInterval(e)}</span></div></div><span class="text-xs text-amber-200">Потрібна оплата</span></div></div>`; }).join('') || `<div class="text-sm text-gray-500">Немає нагальних броней на цю дату.</div>`}</div>
          </div>
        </div>
      </div>
    </div>`;

    lucide.createIcons({nodes:[document.getElementById('content')]});
    this._attachDnD();
  },

  _setMode(mode) { this._mode = mode; this.render(); },
  _formatInterval(ev) { const start = ev.time || ev.startTime || '00:00'; const end = ev.endTime || this._defaultEnd(start); return `${start} - ${end}`; },
  _defaultEnd(start) { if (!/^\d{2}:\d{2}$/.test(start)) return '00:00'; const [h,m] = start.split(':').map(Number); const dt = new Date(); dt.setHours(h); dt.setMinutes(m + 60); return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`; },
  _toMinutes(time) { if (!time || !/^\d{2}:\d{2}$/.test(time)) return 0; const [h,m] = time.split(':').map(Number); return h * 60 + m; },
  _findScheduleConflicts(events) { const intervals = (events || []).map(e => { const start = this._toMinutes(e.time || e.startTime || '00:00'); const end = this._toMinutes(e.endTime || this._defaultEnd(e.time || e.startTime || '00:00')); return {id: e.id, start, end}; }).filter(i => i.start < i.end).sort((a,b) => a.start - b.start); const conflictIds = new Set(); for (let i = 0; i < intervals.length; i++) { for (let j = i + 1; j < intervals.length; j++) { if (intervals[j].start >= intervals[i].end) break; const overlap = Math.min(intervals[i].end, intervals[j].end) - Math.max(intervals[i].start, intervals[j].start); if (overlap > 5) { conflictIds.add(intervals[i].id); conflictIds.add(intervals[j].id); } } } return conflictIds; },

  _weekView() {
    const d = new Date(this._date);
    const dayIndex = (d.getDay() + 6) % 7;
    const weekStart = this._addDays(this._date, -dayIndex);
    const days = Array.from({length:7},(_,i)=>{
      const iso = this._addDays(weekStart, i);
      const events = DB.getSchedulesForDay(iso);
      const conflictIds = this._findScheduleConflicts(events);
      const hasLast = events.some(e=>{ const c = DB.getClient(e.clientId); return c && c.remainingSessions === 1; });
      return {iso, label:new Date(iso).toLocaleDateString('uk-UA',{weekday:'short',day:'numeric'}), events, count:events.length, warn:hasLast, conflicts:conflictIds};
    });
    const workDays = days.slice(0,6); // Mon–Sat for mobile
    const hours = Array.from({length:16},(_,i)=>i+7); // 7–22

    // ── Mobile: compact time-slot grid (no horizontal scroll) ──
    let mob = '<div class="md:hidden select-none">';
    mob += '<div style="display:grid;grid-template-columns:1.6rem repeat(6,1fr)" class="mb-0.5">';
    mob += '<div></div>';
    for (const day of workDays) {
      const wd = new Date(day.iso).toLocaleDateString('uk-UA',{weekday:'short'}).slice(0,2);
      const dd = new Date(day.iso).getDate();
      const act = day.iso === this._date;
      mob += `<div class="text-center py-0.5 cursor-pointer" onclick="Views.Calendar._selectDate('${day.iso}')"><div class="text-[8px] font-bold uppercase ${act?'text-yellow-400':'text-gray-500'}">${wd}</div><div class="text-[9px] font-semibold ${act?'text-yellow-300 underline':'text-gray-300'}">${dd}</div></div>`;
    }
    mob += '</div>';
    mob += '<div class="rounded-2xl overflow-hidden" style="border:1px solid rgba(255,255,255,.08)">';
    for (const h of hours) {
      const hh = String(h).padStart(2,'0');
      mob += `<div style="display:grid;grid-template-columns:1.6rem repeat(6,1fr);height:2.75rem;border-top:1px solid rgba(255,255,255,.05)">`;
      mob += `<div class="text-[7px] text-gray-600 flex items-start pt-0.5 pl-0.5 leading-none">${hh}</div>`;
      for (const day of workDays) {
        const evs = day.events.filter(e=>e.time && e.time.startsWith(hh));
        mob += `<div class="relative" style="height:2.75rem">`;
        for (const e of evs) {
          const c = DB.getClient(e.clientId);
          const parts = (c?.name||'?').split(' ');
          const fn = Utils.esc(parts[0]||'?');
          const ln = Utils.esc(parts[1]||'');
          const rs = c?.remainingSessions??0;
          const ti = this._formatInterval(e).replace(' - ', '-');
          mob += '<div class="absolute inset-0 m-px rounded-sm flex flex-col items-center justify-center overflow-hidden cursor-pointer" style="background:rgba(212,175,55,.22);border:1px solid rgba(212,175,55,.35)" onclick="Views.Calendar._openEventModal(\'' + e.id + '\')">';
          mob += '<span class="text-[6px] font-bold text-yellow-300 leading-tight px-px block max-w-full text-center truncate">' + ti + '</span>';
          mob += '<span class="text-[9px] font-semibold text-yellow-200 leading-tight px-px block max-w-full text-center truncate">' + fn + '</span>';
          if (ln) mob += '<span class="text-[9px] font-semibold text-yellow-200 leading-tight px-px block max-w-full text-center truncate">' + ln + '</span>';
          mob += '<span class="text-[8px] text-gray-400 leading-tight text-center mt-1">' + rs + '</span>';
          mob += '</div>';
        }
        mob += '</div>';
      }
      mob += '</div>';
    }
    mob += '</div></div>';

    // ── Desktop: 7-column card grid ──
    const desktopCards = days.map(day=>{
      const evCards = day.events.map(e=>{
        const c = DB.getClient(e.clientId);
        const conflict = day.conflicts.has(e.id);
        return `<div class="calendar-event-card draggable-schedule ${conflict?'warn':''}" draggable="true" data-sid="${e.id}" onclick="Views.Calendar._openEventModal('${e.id}')"><div class="event-time text-xs font-semibold mb-1 whitespace-nowrap">${this._formatInterval(e)}</div><div class="event-name text-xs font-semibold text-white mb-2 truncate block max-w-full">${Utils.esc(c?.name||'Клієнт')}</div><div class="event-count text-center block mt-1 text-xs text-gray-400">${c?.remainingSessions??0} ${(c?.remainingSessions??0)===1?'заняття':'занять'}</div></div>`;
      }).join('');
      return `<div class="calendar-day ${day.iso===this._date?'selected':''} ${day.warn?'warn':''}"><div class="flex items-center justify-between gap-2 mb-2 cursor-pointer" onclick="Views.Calendar._selectDate('${day.iso}')"><div class="text-sm font-semibold text-white">${day.label}</div><div class="text-xs text-gray-400">${day.count}</div></div><div class="space-y-3 text-[11px] text-gray-300">${evCards}</div></div>`;
    }).join('');
    const desk = `<div class="hidden md:block"><div class="week-grid grid gap-2 mb-4 grid-cols-7">${desktopCards}</div></div>`;

    return mob + desk;
  },

  _prev() { if (this._mode==='month') this._date = this._addMonths(this._date, -1); else if (this._mode==='week') this._date = this._addDays(this._date, -7); else this._date = this._addDays(this._date, -1); this.render(); },
  _next() { if (this._mode==='month') this._date = this._addMonths(this._date, +1); else if (this._mode==='week') this._date = this._addDays(this._date, +7); else this._date = this._addDays(this._date, +1); this.render(); },

  _monthView() {
    const d = new Date(this._date); const year = d.getFullYear(); const month = d.getMonth();
    const first = new Date(year, month, 1);
    const lastDay = new Date(year, month+1, 0).getDate();
    const startWeekday = (first.getDay()+6)%7;
    const cells = [];
    for (let i=0;i<startWeekday;i++) cells.push({empty:true});
    for (let day=1; day<=lastDay; day++) { const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; const count = DB.getSchedulesForDay(iso).length; cells.push({iso, day, count}); }
    while (cells.length % 7 !== 0) cells.push({empty:true});
    return `<div class="calendar-grid-month mb-4">${cells.map(c=> c.empty?`<div class="calendar-day lead"></div>`:`<div onclick="Views.Calendar._selectDate('${c.iso}')" class="calendar-day ${c.iso===this._date?'selected':''}"><div class="text-sm font-semibold text-white">${c.day}</div><div class="calendar-dot ${c.count?'':'hidden'}"></div><div class="text-[10px] text-gray-400 mt-2 flex items-center justify-center text-center">${c.count} занять</div></div>`).join('')}</div>`;
  },

  _dayView(events) {
    const conflictIds = this._findScheduleConflicts(events);
    const slots = [];
    for (let h=7; h<=22; h++) { const hh = String(h).padStart(2,'0')+':00'; const evs = (events||[]).filter(e=>e.time && e.time.startsWith(String(h).padStart(2,'0'))); slots.push({time:hh, events:evs}); }
    return `<div class="card p-3 overflow-hidden">${slots.map(s=>`<div class="calendar-timeline-slot" data-time="${s.time}"><div class="calendar-hour">${s.time}</div><div class="calendar-slot" data-date="${this._date}" data-time="${s.time}">${s.events.length? s.events.map(e=>{ const c = DB.getClient(e.clientId); const isLast = c && c.remainingSessions===1; const conflict = conflictIds.has(e.id); return `<div class="calendar-event-card draggable-schedule ${conflict?'warn':''}" draggable="true" data-sid="${e.id}" onclick="Views.Calendar._openEventModal('${e.id}')"><div class="event-time text-xs font-semibold mb-1 whitespace-nowrap"><button onclick="event.stopPropagation(); Views.Calendar._openEventModal('${e.id}')" class="text-xs font-semibold underline decoration-dotted whitespace-nowrap ${conflict?'text-amber-100':''}">${this._formatInterval(e)}</button></div><div class="event-name text-sm font-semibold text-white mb-1">${Utils.esc(c?.name||'Клієнт')}</div><div class="flex items-center justify-between text-[11px] ${conflict?'text-amber-100':'text-gray-400'}"><span>${c?.status==='pause'?'Пауза':'Активний'}</span><span>${c?.remainingSessions??0} занять</span></div></div>`; }).join('') : `<div class="flex items-center justify-between w-full text-gray-500"><div>Вільно</div><button onclick="event.stopPropagation(); Views.Calendar._openAddModal('${this._date}','${s.time}')" class="btn btn-sm btn-ghost">+ Запис</button></div>`}</div></div>`).join('')}</div>`;
  },

  _openAddModal(defaultDate, defaultTime) {
    const date = defaultDate || this._date || Utils.today();
    const startTime = defaultTime || '18:00';
    const endTime = this._defaultEnd(startTime);
    Modal.open(`<div class="flex flex-col overflow-hidden" style="max-height:80vh;max-height:80dvh"><div class="flex items-center justify-between px-5 pt-5 pb-3 shrink-0"><div class="font-bold text-white">Новий запис на тренування</div><button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="flex-1 overflow-y-auto min-h-0 px-5 pb-2"><div class="space-y-3"><div><label class="ft-label">Клієнт</label><div class="flex items-center gap-2"><input id="sc-client-search" class="ft-input flex-1 h-12" type="text" placeholder="Пошук клієнта..."><input id="sc-client" type="hidden" value=""><button id="sc-add-btn" class="btn btn-sm btn-gold h-12 px-3" type="button">+</button></div><div id="sc-client-list" class="mt-2 bg-white/5 rounded-lg max-h-52 overflow-auto hidden"></div><div id="sc-new-client-form" class="mt-3 p-3 rounded-lg bg-white/3 hidden"><div class="text-sm font-semibold text-white mb-2">Швидке створення клієнта</div><input id="sc-new-name" class="ft-input mb-2 h-12" placeholder="ПІБ клієнта"><input id="sc-new-phone" class="ft-input mb-2 h-12" placeholder="Телефон"><div class="flex gap-2"><button id="sc-new-cancel" class="btn btn-ghost flex-1 h-12">Скасувати</button><button id="sc-new-save" class="btn btn-gold flex-1 h-12">Створити</button></div></div></div><div class="grid grid-cols-2 gap-3"><div><label class="ft-label">Дата</label><input id="sc-date" class="ft-input h-12" type="date" value="${date}"></div><div><label class="ft-label">Тариф</label><select id="sc-tariff" class="ft-input h-12"><option value="">— без тарифу —</option><option value="Індивідуал">Індивідуал — 450 ₴</option><option value="Спліт разовий">Спліт разовий — 700 ₴</option><option value="8 тренувань">8 тренувань — 2800 ₴</option><option value="10 тренувань">10 тренувань — 3500 ₴</option><option value="8 спліт">8 спліт — 4400 ₴</option><option value="10 спліт">10 спліт — 5000 ₴</option></select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="ft-label">Початок</label><input id="sc-start" class="ft-input h-12" type="time" value="${startTime}"></div><div><label class="ft-label">Кінець</label><input id="sc-end" class="ft-input h-12" type="time" value="${endTime}"></div></div><div><label class="ft-label">Нотатки</label><textarea id="sc-notes" class="ft-input" rows="3" placeholder="Особливості, побажання..."></textarea></div></div></div><div class="shrink-0 flex gap-2 px-5 pt-4 border-t border-white/10" style="background:rgba(10,10,16,.95);padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))"><button onclick="Modal.close()" class="btn btn-ghost flex-1">Скасувати</button><button onclick="Views.Calendar._saveSchedule()" class="btn btn-gold flex-1">Зберегти запис</button></div></div>`);
    lucide.createIcons({nodes:[document.getElementById('modal-box')]});
    (function(){
      const search = document.getElementById('sc-client-search');
      const hidden = document.getElementById('sc-client');
      const list = document.getElementById('sc-client-list');
      const addBtn = document.getElementById('sc-add-btn');
      const newForm = document.getElementById('sc-new-client-form');
      const newName = document.getElementById('sc-new-name');
      const newPhone = document.getElementById('sc-new-phone');
      const newSave = document.getElementById('sc-new-save');
      const newCancel = document.getElementById('sc-new-cancel');
      function renderMatches(q){ const clients = DB.getClients(); const ql = (q||'').toLowerCase(); const matches = clients.filter(c=>c.name.toLowerCase().includes(ql) || (c.phone||'').includes(ql)).slice(0,20); if(!matches.length){ list.classList.add('hidden'); list.innerHTML=''; return; } list.classList.remove('hidden'); list.innerHTML = matches.map(function(c){ var n = Utils.esc(c.name); return '<div class="px-3 py-2 cursor-pointer hover:bg-white/5" data-id="'+c.id+'" data-name="'+n+'">'+n+' <span class="text-xs text-gray-400">('+((c.remainingSessions||0))+' занять)</span></div>'; }).join(''); list.querySelectorAll('div[data-id]').forEach(el=>el.addEventListener('click', ()=>{ hidden.value = el.dataset.id; search.value = el.dataset.name; list.classList.add('hidden'); })); }
      search.addEventListener('input', (e)=>{ renderMatches(e.target.value); hidden.value = ''; });
      search.addEventListener('focus', ()=>{ renderMatches(search.value); });
      document.addEventListener('click', (e)=>{ if(!e.target.closest('#sc-client-list') && !e.target.closest('#sc-client-search') && !e.target.closest('#sc-add-btn')) list.classList.add('hidden'); });
      addBtn.addEventListener('click', ()=>{ newForm.classList.toggle('hidden'); newName.focus(); });
      newCancel.addEventListener('click', ()=>{ newForm.classList.add('hidden'); });
      newSave.addEventListener('click', ()=>{ const name = (newName.value||'').trim(); const phone = (newPhone.value||'').trim(); if(!name){ Toast.show('Введіть ПІБ клієнта','err'); return; } const id = DB.uid(); const start = Utils.today(); const client = { id, name, phone, email:'', gender:'male', age:30, height:170, currentWeight:70, targetWeight:70, goal:'', activityLevel:1.2, startDate:start, status:'active', remainingSessions:0, package:'', notes:'', weightHistory:[{date:start,weight:70}] }; DB.saveClient(client); hidden.value = id; search.value = name; newForm.classList.add('hidden'); renderMatches(''); Toast.show('Клієнта додано'); });
    })();
  },

  _saveSchedule() {
    try {
      const hiddenClientId = document.getElementById('sc-client').value;
      const searchNameRaw = (document.getElementById('sc-client-search') && document.getElementById('sc-client-search').value) || '';
      const searchName = searchNameRaw.trim();
      const date = document.getElementById('sc-date').value;
      const start = document.getElementById('sc-start').value;
      const end = document.getElementById('sc-end').value;
      const tariffName = (document.getElementById('sc-tariff') && document.getElementById('sc-tariff').value) || '';
      const notes = document.getElementById('sc-notes').value.trim();
      if (!date) throw new Error('Виберіть дату');
      if (!start) throw new Error('Введіть початок');
      if (!end) throw new Error('Введіть кінець');
      if (start >= end) throw new Error('Час завершення має бути пізніше початку');
      let clientId = hiddenClientId || '';
      if (!clientId && searchName) {
        const existing = DB.getClients().find(c=> (c.name||'').trim().toLowerCase() === searchName.toLowerCase());
        if (existing) { clientId = existing.id; } else {
          const id = DB.uid();
          const today = Utils.today();
          const newClient = { id, name: searchName, phone: '', email: '', gender: 'male', age: 0, height: 0, currentWeight: 0, targetWeight: 0, goal: '', activityLevel: 1, startDate: today, status: 'active', remainingSessions: 0, package: '', notes: '', weightHistory: [], };
          DB.saveClient(newClient);
          clientId = id;
          const hid = document.getElementById('sc-client'); if (hid) hid.value = id;
          Toast.show('Клієнта автоматично створено');
        }
      }
      if (!clientId) throw new Error('Оберіть клієнта');
      const client = DB.getClient(clientId);
      if (!client) throw new Error('Оберіть клієнта');
      const tariff = TARIFFS.find(t=>t.name===tariffName);
      if (tariff) {
        DB.addSessionsToClient(clientId, tariff.sessions);
        DB.saveFinancialTransaction({clientId, amount:tariff.price, service:tariff.name, date});
        Toast.show(`Тариф "${tariff.name}" — ${tariff.price} ₴, +${tariff.sessions} зан.`, 'info');
      } else if (typeof client.remainingSessions !== 'number' || client.remainingSessions <= 0) {
        Toast.show('У клієнта немає оплачених занять — запис створено, але зверніть увагу.','info');
      }
      DB.saveSchedule({ clientId, date, time:start, endTime:end, status:'scheduled', notes, });
      Modal.close(); this.render(date); Toast.show('🎉 Запис успішно створено!');
    } catch(e) { Toast.show(e.message,'err'); }
  },

  _selectDate(date) { this._date = date; this._mode = 'day'; this.render(); },
  _complete(id) { DB.completeSchedule(id); this.render(); Toast.show('Тренування завершено'); },
  _delete(id) { Modal.open(`<div class="p-5"><div class="flex items-center justify-between mb-4"><div class="font-bold text-white">Видалити тренування?</div><button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-sm text-gray-300 mb-4">Оберіть дію з абонементом клієнта:</div><div class="flex flex-col gap-2"><button onclick="Views.Calendar._deleteWithReturn('${id}')" class="btn btn-emerald w-full"><i data-lucide="plus-circle" class="w-4 h-4"></i>Повернути на баланс</button><button onclick="Views.Calendar._deleteConfirmed('${id}')" class="btn btn-danger w-full"><i data-lucide="trash-2" class="w-4 h-4"></i>Списати заняття</button><button onclick="Modal.close()" class="btn btn-ghost w-full">Скасувати</button></div></div>`); lucide.createIcons({nodes:[document.getElementById('modal-box')]}); },
  _deleteWithReturn(id) { const ev = DB.getSchedule(id); if (ev && ev.clientId) DB.addSessionsToClient(ev.clientId, 1); DB.deleteSchedule(id); Modal.close(); this.render(); Toast.show('Запис видалено, заняття повернено на баланс'); },
  _deleteConfirmed(id) { DB.deleteSchedule(id); Modal.close(); this.render(); Toast.show('Запис видалено'); },
  _addDays(base, offset) { const d = new Date(base); d.setDate(d.getDate() + offset); return d.toISOString().slice(0,10); },
  _addMonths(base, offset) { const d = new Date(base); d.setMonth(d.getMonth() + offset); return d.toISOString().slice(0,10); },
  _attachDnD() {
    document.querySelectorAll('.draggable-schedule').forEach(el=>{
      el.addEventListener('dragstart', (ev)=>{ ev.dataTransfer.setData('text/schedule', el.dataset.sid); el.classList.add('dragging'); });
      el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });
      el.addEventListener('touchstart', (ev)=>{ window._ft_drag = el.dataset.sid; }, {passive:true});
    });
    document.querySelectorAll('.calendar-slot').forEach(slot=>{
      slot.addEventListener('dragover', (e)=>{ e.preventDefault(); slot.classList.add('drop-over'); });
      slot.addEventListener('dragleave', ()=>{ slot.classList.remove('drop-over'); });
      slot.addEventListener('drop', (e)=>{ e.preventDefault(); slot.classList.remove('drop-over'); const sid = e.dataTransfer.getData('text/schedule'); if (!sid) return; const targetDate = slot.dataset.date; const targetTime = slot.dataset.time; this._moveSchedule(sid, targetDate, targetTime); });
      slot.addEventListener('touchend', (ev)=>{ if (window._ft_drag) { const sid = window._ft_drag; delete window._ft_drag; const targetDate = slot.dataset.date; const targetTime = slot.dataset.time; this._moveSchedule(sid, targetDate, targetTime); } });
    });
  },
  _moveSchedule(sid, date, time) { const ev = DB.getSchedule(sid); if (!ev) return; ev.date = date; ev.time = time; DB.saveSchedule(ev); Toast.show('Час тренування оновлено'); this.render(this._date); },
  _openEventModal(sid) { const ev = DB.getSchedule(sid); if (!ev) return; const c = DB.getClient(ev.clientId); Modal.open(`<div class="p-5"><div class="flex items-center justify-between mb-3"><div class="font-bold text-white">Деталі запису</div><button onclick="Modal.close()" class="btn btn-icon btn-ghost"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="space-y-3"><div class="flex items-center gap-3">${Utils.avatar(c.name,52)}<div><div class="font-semibold text-white">${Utils.esc(c.name)}</div><div class="text-xs text-gray-400">${GOALS[c.goal]?.label||'—'} · ${c.currentWeight} кг</div></div></div><div class="flex flex-wrap gap-3"><div class="text-sm text-gray-300">${ev.date}</div><div class="grid grid-cols-2 gap-3" style="min-width:220px"><div><label class="ft-label">Початок</label><input id="ev-start-input" class="ft-input" type="time" value="${ev.time || ev.startTime || '18:00'}" /></div><div><label class="ft-label">Кінець</label><input id="ev-end-input" class="ft-input" type="time" value="${ev.endTime || this._defaultEnd(ev.time || ev.startTime || '18:00')}" /></div></div><button onclick="Views.Calendar._saveTimeInline('${sid}')" class="btn btn-sm btn-gold">Зберегти час</button></div><div class="flex items-center gap-3"><div class="text-xs text-gray-400">Залишок занять</div><div class="text-sm font-semibold text-white">${c.remainingSessions??0}</div><div class="flex gap-2 ml-4"><button onclick="Views.Calendar._changeSessions('${c.id}',1)" class="btn btn-sm btn-ghost">+</button><button onclick="Views.Calendar._changeSessions('${c.id}',-1)" class="btn btn-sm btn-danger">-</button></div></div>${ev.notes?`<div class="card" style="background:rgba(255,255,255,.02)"><div class="text-sm text-gray-300">${Utils.esc(ev.notes)}</div></div>`:''}</div><div class="flex gap-2 mt-4 flex-wrap"><button onclick="Views.Calendar._delete('${sid}')" class="btn btn-danger btn-sm"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i>Видалити</button><button onclick="Modal.close()" class="btn btn-ghost flex-1">Закрити</button><button onclick="Views.Calendar._complete('${sid}')" class="btn btn-gold flex-1">Готово</button></div></div>`); lucide.createIcons({nodes:[document.getElementById('modal-box')]}); },
  _changeSessions(cid, delta) { const c = DB.getClient(cid); if (!c) return; c.remainingSessions = Math.max(0, (c.remainingSessions||0) + delta); DB.saveClient(c); Toast.show('Залишок занять оновлено'); Modal.close(); this.render(this._date); },
  _saveTimeInline(sid) { const startEl = document.getElementById('ev-start-input'); const endEl = document.getElementById('ev-end-input'); if (!startEl || !endEl) return; const start = startEl.value; const end = endEl.value; if (!start || !end) { Toast.show('Вкажіть початок і кінець','err'); return; } if (start >= end) { Toast.show('Час завершення має бути пізніше початку','err'); return; } const ev = DB.getSchedule(sid); if (!ev) return; ev.time = start; ev.endTime = end; DB.saveSchedule(ev); Modal.close(); this.render(this._date); Toast.show('Час оновлено'); },
};

const Export = {
  print(cid) {
    const c = DB.getClient(cid); if (!c) return; const r  = Calc.run({gender:c.gender,weight:c.currentWeight,height:c.height,age:c.age,activityLevel:c.activityLevel,goal:c.goal}); const d  = Utils.delta(c.weightHistory); const tK = r.macros.protein*4+r.macros.fat*9+r.macros.carbs*4; const rows = [...(c.weightHistory||[])].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10); const wrap = document.getElementById('print-wrap');
    wrap.innerHTML = `<div class="print-report"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #eee"><div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin-bottom:6px">Звіт клієнта · FitTrack</div><h1 style="font-size:26px;font-weight:800;margin:0 0 4px;color:#111">${Utils.esc(c.name)}</h1><div style="font-size:13px;color:#666">${GOALS[c.goal]?.label||'—'} · З ${Utils.fmtDate(c.startDate)} · Звіт: ${new Date().toLocaleDateString('uk-UA')}</div></div><div style="text-align:right"><div style="font-size:30px;font-weight:800;color:#D4A017">${c.currentWeight} кг</div><div style="font-size:11px;color:#888">поточна вага</div></div></div><div class="pr-section"><h2>Загальні показники</h2><div class="pr-grid"><div class="pr-stat"><div class="val">${c.currentWeight}</div><div class="lbl">Поточна вага, кг</div></div><div class="pr-stat"><div class="val">${c.targetWeight}</div><div class="lbl">Ціль, кг</div></div><div class="pr-stat"><div class="val" style="color:${d!==null&&d<0?'#10B981':'#F43F5E'}">${d!==null?(d>0?'+':'')+d:'—'}</div><div class="lbl">Зміна ваги, кг</div></div><div class="pr-stat"><div class="val">${Math.abs(c.targetWeight-c.currentWeight).toFixed(1)}</div><div class="lbl">До цілі, кг</div></div></div></div><div class="pr-section"><h2>Калорійність</h2><div class="pr-grid"><div class="pr-stat"><div class="val">${r.bmr}</div><div class="lbl">BMR, ккал</div></div><div class="pr-stat"><div class="val">${r.tdee}</div><div class="lbl">TDEE, ккал</div></div><div class="pr-stat"><div class="val" style="color:#D4A017">${r.kcal}</div><div class="lbl">Норма/день, ккал</div></div><div class="pr-stat"><div class="val">${r.bmi} <span style="font-size:11px;color:#888">(${r.bmiLabel})</span></div><div class="lbl">ІМТ</div></div></div></div>${rows.length?`<div class="pr-section"><h2>Журнал зважувань (останні ${rows.length})</h2><table class="pr-table"><thead><tr><th>Дата</th><th>Вага, кг</th><th>Зміна</th></tr></thead><tbody>${rows.map((e,i)=>{const prev=rows[i+1];const diff=prev?(e.weight-prev.weight).toFixed(1):null;return `<tr><td>${Utils.fmtDate(e.date)}</td><td style="font-weight:700">${e.weight}</td><td style="color:${diff===null?'#888':parseFloat(diff)<0?'#10B981':'#F43F5E'}">${diff!==null?(parseFloat(diff)>0?'+':'')+diff:' —'}</td></tr>`;}).join('')}</tbody></table></div>`:''}${c.notes?`<div class="pr-section"><h2>Нотатки тренера</h2><p style="font-size:13px;color:#444;line-height:1.6">${Utils.esc(c.notes)}</p></div>`:''}<div style="margin-top:32px;padding-top:16px;border-top:1px solid #eee;font-size:11px;color:#bbb;text-align:center">Звіт сформовано ${new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'})} · FitTrack — Кабінет персонального тренера</div></div>`;
    wrap.classList.remove('hidden');
    setTimeout(()=>{ window.print(); setTimeout(()=>wrap.classList.add('hidden'),800); }, 150);
  },
};

const App = {
  async init() {
    const loader = document.getElementById('app-loader');
    const appEl  = document.getElementById('app');
    loader.classList.remove('hidden');

    const { data:{ session } } = await SUPA.auth.getSession();
    if (!session) {
      loader.classList.add('hidden');
      this._showAuth();
      return;
    }
    await DB.init(session.user);
    loader.classList.add('hidden');
    appEl.classList.remove('hidden');

    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    this._theme(DB.getTheme());
    this._bindTheme();
    document.getElementById('back-btn')?.addEventListener('click',()=>Router.go('clients'));
    Router.init();
  },

  _showAuth() {
    const screen = document.getElementById('auth-screen');
    const form   = document.getElementById('login-form');
    const errEl  = document.getElementById('auth-error');
    const btn    = document.getElementById('auth-submit');
    screen.classList.remove('hidden');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Входимо...';
      const { data, error } = await SUPA.auth.signInWithPassword({
        email:    document.getElementById('auth-email').value.trim(),
        password: document.getElementById('auth-password').value,
      });
      if (error) {
        errEl.textContent = error.message === 'Invalid login credentials'
          ? 'Невірний email або пароль' : error.message;
        btn.disabled = false;
        btn.textContent = 'Увійти';
        return;
      }
      screen.classList.add('hidden');
      const loader = document.getElementById('app-loader');
      loader.classList.remove('hidden');
      await DB.init(data.user);
      loader.classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
      this._theme(DB.getTheme());
      this._bindTheme();
      document.getElementById('back-btn')?.addEventListener('click',()=>Router.go('clients'));
      Router.init();
    });
  },

  _theme(t) {
    document.documentElement.classList.toggle('dark',  t==='dark');
    document.documentElement.classList.toggle('light', t!=='dark');
    const icon  = t==='dark' ? 'moon' : 'sun';
    const label = t==='dark' ? 'Темна тема' : 'Світла тема';
    ['theme-icon','theme-icon-mobile'].forEach(id=>{ const el=document.getElementById(id); if(el){ el.setAttribute('data-lucide',icon); lucide.createIcons({nodes:[el.parentElement]}); } });
    const lbl=document.getElementById('theme-label'); if(lbl) lbl.textContent=label;
  },

  _bindTheme() { const go=()=>{ const n=DB.getTheme()==='dark'?'light':'dark'; DB.setTheme(n); this._theme(n); }; document.getElementById('theme-toggle')?.addEventListener('click',go); document.getElementById('theme-toggle-mobile')?.addEventListener('click',go); },
};

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
